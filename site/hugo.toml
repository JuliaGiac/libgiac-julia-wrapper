# baseURL is overridden in CI by the URL GitHub Pages reports.
baseURL = "https://juliagiac.github.io/libgiac-julia-wrapper/"
title = "libgiac-julia-wrapper"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

[params]
description = "The C++ bridge between Giac and Julia."

[menus]
  [[menus.main]]
    name = "Overview"
    pageRef = "/"
    weight = 1
  [[menus.main]]
    name = "API"
    pageRef = "/api"
    weight = 2
  [[menus.main]]
    name = "Building and testing"
    pageRef = "/building"
    weight = 3
  [[menus.main]]
    name = "Platform support"
    pageRef = "/platforms"
    weight = 4

# Code is highlighted with CSS classes; static/syntax.css holds the light
# (github) and dark (github-dark) palettes, shared with juliagiac.github.io.
[markup.highlight]
noClasses = false
